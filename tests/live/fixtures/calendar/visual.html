<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>snice-calendar overlay-anchor fixture</title>
    <link rel="stylesheet" href="/packages/components/src/theme/theme.css">
    <style>
      /* FIXTURE, not a showcase. The three calendars below exist so the
         overlay-anchoring spec can measure where event overlays land:
           - #cal-popover carries the click-to-open popover cases, with
             #cal-noselect directly AFTER it in DOM order — the regression
             the spec guards is the popover drifting down onto the next
             section's calendar and being painted over by that section's own
             contained host;
           - #cal-default carries the hover tooltip case;
           - events are relative to the CURRENT month via addDays(today, n),
             the same way the showcase authors them, so the bars always
             exist;
           - no avatars, no remote assets, no page chrome — the fixture is
             the three calendars on the theme's surface and nothing else. */
      html, body { margin: 0; padding: 0; }
      body {
        min-height: 100vh;
        background: var(--snice-color-surface);
        color: var(--snice-color-text);
        font-family: var(--snice-font-family, system-ui, sans-serif);
      }
      body > section { padding: 1rem 1.5rem; }
      body > section h2 {
        margin: 0 0 0.5rem;
        font-size: 0.75rem;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: var(--snice-color-text-tertiary);
      }
      snice-calendar { display: block; }
      /* The showcase constrains the default calendar to 400px; the chip
         legibility spec's one-cell/wide thresholds derive from that width,
         so the fixture keeps it. */
      #cal-default { max-width: 400px; }
    </style>
  </head>
  <body>
    <section>
      <h2>Default (month view)</h2>
      <snice-calendar id="cal-default"></snice-calendar>
    </section>
    <section>
      <h2>highlight-today: true (default) vs false</h2>
      <div class="side-by-side">
        <div><snice-calendar highlight-today></snice-calendar></div>
        <div><snice-calendar highlight-today="false"></snice-calendar></div>
      </div>
    </section>

    <section>
      <h2>show-week-numbers</h2>
      <snice-calendar show-week-numbers></snice-calendar>
    </section>

    <section>
      <h2>locale: ja-JP</h2>
      <snice-calendar locale="ja-JP"></snice-calendar>
    </section>

    <section>
      <h2>Multiple colored events on same date</h2>
      <snice-calendar id="cal-multi-events" style="height: 46rem; max-width: 30rem"></snice-calendar>
    </section>

    <section>
      <h2>Event popovers (click an event)</h2>
      <snice-calendar id="cal-popover"></snice-calendar>
    </section>

    <section>
      <h2>no-day-select (display-only)</h2>
      <snice-calendar id="cal-noselect" no-day-select></snice-calendar>
    </section>


    <script type="module">
      import '/packages/components/src/calendar/snice-calendar.ts';

      function addDays(date, days) {
        const d = new Date(date);
        d.setDate(d.getDate() + days);
        return d;
      }
      const today = new Date();
      const fmt = (date) => new Intl.DateTimeFormat('en-US', {
        month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit',
      }).format(date);

      /** A locally generated avatar so the chip's image really loads. */
      function avatar(hex, name) {
        const canvas = document.createElement('canvas');
        canvas.width = 40;
        canvas.height = 40;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = hex;
        ctx.beginPath();
        ctx.arc(20, 20, 20, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 16px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(name[0], 20, 21);
        return canvas.toDataURL('image/png');
      }

      const calDefault = document.getElementById('cal-default');
      calDefault.events = [
        { id: 'd1', title: 'Design sync', start: addDays(today, 1), color: '#2563eb', avatar: { src: avatar('#2563eb', 'Dana Ives'), name: 'Dana Ives' } },
        { id: 'd2', title: 'Offsite', start: addDays(today, 2), end: addDays(today, 9), color: '#0891b2', tooltip: 'Team offsite — Lisbon', popover: true },
        { id: 'd3', title: 'Release', start: addDays(today, 6), color: '#16a34a', popover: 'Ships v7.6 — changelog in #releases' },
        { id: 'd4', title: 'On call', start: addDays(today, 12), end: addDays(today, 15), color: '#7c3aed', avatar: { src: avatar('#7c3aed', 'Sam Reyes'), name: 'Sam Reyes' } },
      ];
      calDefault.eventPopover = async (event) => {
        await new Promise((r) => setTimeout(r, 200));
        const card = document.createElement('div');
        card.innerHTML = `<strong>${event.title}</strong>
          <p style="margin:0.5rem 0">${fmt(new Date(event.start))} → ${fmt(new Date(event.end || event.start))}</p>`;
        return card;
      };
      calDefault.eventTooltip = async (event) => {
        await new Promise((r) => setTimeout(r, 120));
        const rich = document.createElement('div');
        const range = event.end ? `${fmt(new Date(event.start))} → ${fmt(new Date(event.end))}` : fmt(new Date(event.start));
        rich.innerHTML = `<strong>${event.title}</strong><br><small>${range}</small>`;
        return rich;
      };

      const calPopover = document.getElementById('cal-popover');
      calPopover.events = [
        { id: 'p1', title: 'Kickoff', start: addDays(today, 1), color: '#2563eb',
          popover: 'Project kickoff — room 2, bring the roadmap.' },
        { id: 'p2', title: 'Audit', start: addDays(today, 3), end: addDays(today, 6), color: '#dc2626', popover: true },
        { id: 'p3', title: 'Retro', start: addDays(today, 8), color: '#16a34a' },
      ];
      calPopover.eventPopover = async (event) => {
        await new Promise((r) => setTimeout(r, 250)); // simulated fetch
        const card = document.createElement('div');
        card.innerHTML = `<strong>${event.title}</strong>
          <p style="margin:0.4rem 0">${fmt(new Date(event.start))} → ${fmt(new Date(event.end || event.start))} · 4 auditors</p>`;
        return card;
      };

      document.getElementById('cal-noselect').events = [
        { id: 'n1', title: 'All hands', start: addDays(today, 2), color: '#2563eb' },
        { id: 'n2', title: 'Freeze', start: addDays(today, 4), end: addDays(today, 8), color: '#dc2626' },
      ];

      document.getElementById('cal-multi-events').events = [
        { id: 'm1', title: 'Event A', start: addDays(today, 1), color: '#2563eb' },
        { id: 'm2', title: 'Event B', start: addDays(today, 1), color: '#16a34a' },
        { id: 'm3', title: 'Event C', start: addDays(today, 1), color: '#7c3aed' },
      ];

      document.documentElement.dataset.fixtureReady = 'true';
    </script>
  </body>
</html>
