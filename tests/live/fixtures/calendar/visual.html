<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>snice-calendar overlay-anchor fixture</title>
    <link rel="stylesheet" href="/packages/components/src/theme/theme.css">
    <style>
      /* FIXTURE, not a showcase. The three calendars below exist so the
         overlay-anchoring spec can measure where event overlays land:
           - #cal-popover carries the click-to-open popover cases, with
             #cal-noselect directly AFTER it in DOM order — the regression
             the spec guards is the popover drifting down onto the next
             section's calendar and being painted over by that section's own
             contained host;
           - #cal-default carries the hover tooltip case;
           - events are relative to the CURRENT month via addDays(today, n),
             the same way the showcase authors them, so the bars always
             exist;
           - no avatars, no remote assets, no page chrome — the fixture is
             the three calendars on the theme's surface and nothing else. */
      html, body { margin: 0; padding: 0; }
      body {
        min-height: 100vh;
        background: var(--snice-color-surface);
        color: var(--snice-color-text);
        font-family: var(--snice-font-family, system-ui, sans-serif);
      }
      body > section { padding: 1rem 1.5rem; }
      body > section h2 {
        margin: 0 0 0.5rem;
        font-size: 0.75rem;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: var(--snice-color-text-tertiary);
      }
      snice-calendar { display: block; }
    </style>
  </head>
  <body>
    <section>
      <h2>Event popovers (click an event)</h2>
      <snice-calendar id="cal-popover"></snice-calendar>
    </section>

    <section>
      <h2>no-day-select (display-only)</h2>
      <snice-calendar id="cal-noselect" no-day-select></snice-calendar>
    </section>

    <section>
      <h2>Default (month view)</h2>
      <snice-calendar id="cal-default"></snice-calendar>
    </section>

    <script type="module">
      import '/packages/components/src/calendar/snice-calendar.ts';

      function addDays(date, days) {
        const d = new Date(date);
        d.setDate(d.getDate() + days);
        return d;
      }
      const today = new Date();
      const fmt = (date) => new Intl.DateTimeFormat('en-US', {
        month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit',
      }).format(date);

      const calDefault = document.getElementById('cal-default');
      calDefault.events = [
        { id: 'd1', title: 'Design sync', start: addDays(today, 1), color: '#2563eb' },
        { id: 'd2', title: 'Offsite', start: addDays(today, 2), end: addDays(today, 9), color: '#0891b2', tooltip: 'Team offsite — Lisbon', popover: true },
        { id: 'd3', title: 'Release', start: addDays(today, 6), color: '#16a34a', popover: 'Ships v7.6 — changelog in #releases' },
        { id: 'd4', title: 'On call', start: addDays(today, 12), end: addDays(today, 15), color: '#7c3aed' },
      ];
      calDefault.eventPopover = async (event) => {
        await new Promise((r) => setTimeout(r, 200));
        const card = document.createElement('div');
        card.innerHTML = `<strong>${event.title}</strong>
          <p style="margin:0.5rem 0">${fmt(new Date(event.start))} → ${fmt(new Date(event.end || event.start))}</p>`;
        return card;
      };

      const calPopover = document.getElementById('cal-popover');
      calPopover.events = [
        { id: 'p1', title: 'Kickoff', start: addDays(today, 1), color: '#2563eb',
          popover: 'Project kickoff — room 2, bring the roadmap.' },
        { id: 'p2', title: 'Audit', start: addDays(today, 3), end: addDays(today, 6), color: '#dc2626', popover: true },
        { id: 'p3', title: 'Retro', start: addDays(today, 8), color: '#16a34a' },
      ];
      calPopover.eventPopover = async (event) => {
        await new Promise((r) => setTimeout(r, 250)); // simulated fetch
        const card = document.createElement('div');
        card.innerHTML = `<strong>${event.title}</strong>
          <p style="margin:0.4rem 0">${fmt(new Date(event.start))} → ${fmt(new Date(event.end || event.start))} · 4 auditors</p>`;
        return card;
      };

      document.getElementById('cal-noselect').events = [
        { id: 'n1', title: 'All hands', start: addDays(today, 2), color: '#2563eb' },
        { id: 'n2', title: 'Freeze', start: addDays(today, 4), end: addDays(today, 8), color: '#dc2626' },
      ];

      document.documentElement.dataset.fixtureReady = 'true';
    </script>
  </body>
</html>
