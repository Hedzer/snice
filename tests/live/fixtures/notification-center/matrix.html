<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>snice-notification-center visual matrix fixture</title>
    <link rel="stylesheet" href="/packages/components/src/theme/theme.css">
    <style>
      /* FIXTURE, not a showcase. Every rule exists so a measurement means
         something:
           - the page sits on the theme's own surface, so the panel's own
             background and an unread row's tint are judged against the
             surface the component was designed for;
           - #stage is a fixed, known box placed WELL INSIDE the viewport, so
             a panel aligned to `start` or `end` has room to be on either side
             and "the panel is off-screen" would be a real failure;
           - #stage has NO padding, background or overlapping content of its
             own, so a failed elementFromPoint probe is the centre occluding
             itself, never the fixture occluding it;
           - the panel's own transition is disabled: a screenshot taken
             mid-transition reads an opacity nobody ever ships. */
      html, body { margin: 0; padding: 0; min-height: 1200px; }
      body {
        background: var(--snice-color-surface);
        color: var(--snice-color-text);
        font-family: var(--snice-font-family, system-ui, sans-serif);
      }
      #stage {
        position: absolute;
        top: 80px;
        left: 480px;
      }
      snice-notification-center::part(panel) {
        transition: none !important;
        animation: none !important;
      }
    </style>
  </head>
  <body>
    <div id="stage"></div>

    <script type="module">
      import '/packages/components/src/notification-center/snice-notification-center.ts';

      const stage = document.getElementById('stage');

      function nextFrame() {
        return new Promise(resolve => requestAnimationFrame(() => requestAnimationFrame(resolve)));
      }
      async function settle() {
        await nextFrame();
        await new Promise(resolve => setTimeout(resolve, 0));
        await nextFrame();
      }

      /** The lists the DOM matrix uses, so both tiers measure one centre. */
      function itemsOf(count, shape = {}) {
        return Array.from({ length: count }, (_, i) => {
          const item = {
            id: `n${i}`,
            title: `Title ${i}`,
            message: `Message ${i}`,
            timestamp: `${i + 1} min ago`,
          };
          if (shape.read === 'alternate') item.read = i % 2 === 1;
          else if (shape.read !== undefined) item.read = shape.read;
          if (shape.type) item.type = shape.type;
          return item;
        });
      }

      const LISTS = {
        empty: [],
        one: itemsOf(1),
        mixed: itemsOf(4, { read: 'alternate' }),
        allRead: itemsOf(3, { read: true }),
        allUnread: itemsOf(3),
        typed: [
          { id: 'a', title: 'Info', message: 'i', timestamp: '1m', type: 'info' },
          { id: 'b', title: 'Success', message: 's', timestamp: '2m', type: 'success' },
          { id: 'c', title: 'Warning', message: 'w', timestamp: '3m', type: 'warning' },
          { id: 'd', title: 'Error', message: 'e', timestamp: '4m', type: 'error' },
        ],
        long: itemsOf(12, { read: 'alternate' }),
      };

      const api = {
        /**
         * Mount one combo. `notifications` is documented JS-only, so it
         * crosses the property channel; `open`, `placement` and `icon` are
         * plain properties too, which is how the docs write them.
         */
        async mount(combo) {
          api.unmount();

          const el = document.createElement('snice-notification-center');
          el.id = 'subject';
          if (combo.slotIcon) el.innerHTML = '<span slot="icon" id="slotted-bell">SB</span>';
          stage.appendChild(el);
          await el.ready;

          if (combo.placement) el.placement = combo.placement;
          if (combo.icon) el.icon = combo.icon;
          el.notifications = LISTS[combo.list ?? 'mixed'];
          if (combo.open) el.open = true;
          await settle();

          const sr = el.shadowRoot;
          return {
            items: sr.querySelectorAll('.notification-item').length,
            unread: sr.querySelectorAll('.notification-item.unread').length,
            open: el.open,
          };
        },

        unmount() { stage.innerHTML = ''; },

        get el() { return document.getElementById('subject'); },
        settle,
      };

      window.matrix = api;
      document.documentElement.dataset.matrixReady = 'true';
    </script>
  </body>
</html>
