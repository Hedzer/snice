<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>snice-code-block visual matrix fixture</title>
    <link rel="stylesheet" href="/packages/components/src/theme/theme.css">
    <style>
      /* FIXTURE, not a showcase. Every rule exists so a measurement means
         something:
           - the page sits on the theme's own surface, so the block's own dark
             or light chrome is judged against the surface it was designed for;
           - #stage is a fixed, known box, so "the gutter is left of the code"
             and "the header sits above the content" are facts about the
             component and not about the viewport;
           - #stage has NO padding, background or overlapping content of its
             own, so a failed elementFromPoint probe is the block occluding
             itself, never the fixture occluding it;
           - #stage is deliberately NARROW for the overflow combos, because
             `.code-block__content` promises `overflow-x: auto` and that
             promise only means something against a line too long to fit;
           - the copy button's transition is disabled: a screenshot taken
             mid-transition reads a colour nobody ever ships. */
      html, body { margin: 0; padding: 0; }
      body {
        background: var(--snice-color-surface);
        color: var(--snice-color-text);
        font-family: var(--snice-font-family, system-ui, sans-serif);
      }
      #stage {
        position: absolute;
        top: 40px;
        left: 40px;
        width: 640px;
      }
      #stage.narrow { width: 240px; }
      snice-code-block::part(copy-button) { transition: none !important; }
    </style>
  </head>
  <body>
    <div id="stage"></div>

    <script type="module">
      import '/packages/components/src/code-block/snice-code-block.ts';

      const stage = document.getElementById('stage');

      function nextFrame() {
        return new Promise(resolve => requestAnimationFrame(() => requestAnimationFrame(resolve)));
      }
      async function settle() {
        await nextFrame();
        await new Promise(resolve => setTimeout(resolve, 0));
        await nextFrame();
      }

      /** The snippets the DOM matrix uses, so both tiers measure one block. */
      const SNIPPETS = {
        oneLine: 'const x = 1;',
        threeLines: 'const x = 1;\nconst y = 2;\nconst sum = x + y;',
        withBlank: 'const x = 1;\n\nconst y = 2;',
        json: '{\n  "a": 1,\n  "b": [2, 3]\n}',
        wide: 'const aVeryLongIdentifierName = someFunctionWithAnEquallyLongName(alpha, beta, gamma, delta);',
      };

      const api = {
        /**
         * Mount one combo the way the docs write it: the code as SLOTTED text
         * (auto-dedented), and every attribute-backed property as an attribute
         * set BEFORE connection — `show-line-numbers`, `start-line`, `theme`.
         * `highlightLines` is documented JS-only, so it is assigned as a
         * property before insertion, which is the only channel it has.
         */
        async mount(combo) {
          api.unmount();
          stage.classList.toggle('narrow', !!combo.narrow);

          const el = document.createElement('snice-code-block');
          el.id = 'subject';
          el.setAttribute('language', combo.language ?? 'javascript');
          if (combo.showLineNumbers) el.setAttribute('show-line-numbers', '');
          if (combo.startLine !== undefined) el.setAttribute('start-line', String(combo.startLine));
          if (combo.copyable === false) el.setAttribute('copyable', 'false');
          if (combo.filename) el.setAttribute('filename', combo.filename);
          if (combo.theme) el.setAttribute('theme', combo.theme);
          if (combo.highlightLines) el.highlightLines = combo.highlightLines;

          const code = SNIPPETS[combo.snippet ?? 'threeLines'];
          el.innerHTML = '\n' + code.split('\n')
            .map(line => (line ? '        ' + line : line)).join('\n') + '\n      ';

          stage.appendChild(el);
          await el.ready;
          await settle();

          const sr = el.shadowRoot;
          return {
            code: el.code,
            lines: sr.querySelectorAll('.code-block__line').length,
            numbers: [...sr.querySelectorAll('.code-block__line-number')]
              .map(node => Number(node.textContent.trim())),
            sourceLines: code.split('\n'),
          };
        },

        unmount() {
          stage.innerHTML = '';
          stage.classList.remove('narrow');
        },

        get el() { return document.getElementById('subject'); },
        settle,
      };

      window.matrix = api;
      document.documentElement.dataset.matrixReady = 'true';
    </script>
  </body>
</html>
