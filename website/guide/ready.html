<h3>Ready</h3>
<p class="desc"><code>@ready()</code> runs after the element is connected and its first render has committed, so queries can access the rendered DOM.</p>
<snice-code-block language="snice" grammar="grammars/snice.json">@ready()
onMount() {
  this.checkbox.focus();
  this.startMeasurement();
}</snice-code-block>
